<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khôi Phục Mật Khẩu - Hệ Thống Quản Lý Thu Chi</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-key"></i>
      </div>
      <h1 class="auth-title">Khôi Phục Mật Khẩu</h1>
      <p class="auth-subtitle">Nhập email đăng ký để nhận hướng dẫn cấp lại mật khẩu</p>
    </div>

    <div id="auth-alert" class="auth-alert"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label class="form-label" for="forgot-email">Địa chỉ Email</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="forgot-email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
        </div>
      </div>

      <button type="submit" id="btn-forgot-submit" class="btn btn-primary btn-block">
        <i class="fas fa-paper-plane"></i> Gửi Liên Kết Khôi Phục
      </button>
    </form>

    <div class="auth-footer">
      Nhớ lại mật khẩu? <a href="/login.html">Quay lại đăng nhập</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { showToast } from '/js/utils.js';

    const form = document.getElementById('forgot-form');
    const alertBox = document.getElementById('auth-alert');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      alertBox.textContent = `Hệ thống đã gửi liên kết đặt lại mật khẩu đến ${email}. Vui lòng kiểm tra hộp thư của bạn!`;
      alertBox.className = 'auth-alert success active';
      showToast('Đã gửi email khôi phục thành công!');
    });
  </script>
</body>
</html>
