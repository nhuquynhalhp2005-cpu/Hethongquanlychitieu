<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch Sử Giao Dịch - Hệ Thống Tài Chính Cá Nhân</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="app-layout" id="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-wrapper">
      <header class="header" id="header"></header>

      <main class="page-content" id="page-content">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--brand-navy); margin-bottom: 0.25rem;">Lịch Sử Giao Dịch Tổng Hợp</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem;">Toàn bộ dữ liệu thu và chi theo thời gian thực</p>
          </div>
          <div style="display: flex; gap: 0.75rem;">
            <button id="btn-export-csv" class="btn btn-secondary">
              <i class="fas fa-file-export"></i> Xuất Tệp CSV
            </button>
            <a href="/income.html" class="btn btn-success">
              <i class="fas fa-plus"></i> Thu
            </a>
            <a href="/expenses.html" class="btn btn-danger">
              <i class="fas fa-minus"></i> Chi
            </a>
          </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="filter-toolbar">
          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Tìm kiếm</label>
            <input type="text" id="trans-search-input" class="form-control" placeholder="Nội dung, ghi chú..." />
          </div>

          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Loại giao dịch</label>
            <select id="filter-type" class="form-control">
              <option value="">Tất cả (Thu & Chi)</option>
              <option value="income">Chỉ Khoản Thu (+)</option>
              <option value="expense">Chỉ Khoản Chi (-)</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Danh mục</label>
            <select id="filter-category" class="form-control">
              <option value="">Tất cả danh mục</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Theo tháng</label>
            <input type="month" id="filter-month" class="form-control" />
          </div>

          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Theo ngày</label>
            <input type="date" id="filter-date" class="form-control" />
          </div>

          <div class="filter-group">
            <label class="form-label" style="margin-bottom: 0.25rem;">Sắp xếp</label>
            <select id="sort-by" class="form-control">
              <option value="date-desc">Mới nhất trước</option>
              <option value="date-asc">Cũ nhất trước</option>
              <option value="amount-desc">Số tiền cao nhất</option>
              <option value="amount-asc">Số tiền thấp nhất</option>
            </select>
          </div>

          <div class="filter-group" style="flex: 0;">
            <label class="form-label" style="visibility: hidden; margin-bottom: 0.25rem;">Xóa</label>
            <button id="btn-reset-filter" class="btn btn-ghost" title="Đặt lại bộ lọc">
              <i class="fas fa-undo"></i>
            </button>
          </div>
        </div>

        <!-- Summary Metric Card -->
        <div style="display: flex; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;">
          <div class="card" style="padding: 1rem 1.5rem; flex: 1; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 0.8125rem; color: var(--text-muted);">Tổng số giao dịch</div>
              <div id="trans-count" style="font-size: 1.25rem; font-weight: 800; color: var(--brand-navy);">0 giao dịch</div>
            </div>
            <i class="fas fa-exchange-alt" style="font-size: 1.5rem; color: var(--text-light);"></i>
          </div>

          <div class="card" style="padding: 1rem 1.5rem; flex: 1; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 0.8125rem; color: var(--text-muted);">Dòng tiền ròng (Thu - Chi trong kỳ)</div>
              <div id="trans-net-total" style="font-size: 1.25rem; font-weight: 800; color: var(--brand-navy);">0 ₫</div>
            </div>
            <i class="fas fa-balance-scale" style="font-size: 1.5rem; color: var(--primary);"></i>
          </div>
        </div>

        <!-- Data Table -->
        <div class="card" style="padding: 1rem;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Ngày</th>
                  <th>Loại</th>
                  <th>Nội dung</th>
                  <th>Danh mục</th>
                  <th>Số tiền</th>
                  <th>Ghi chú</th>
                  <th style="text-align: right;">Thao tác</th>
                </tr>
              </thead>
              <tbody id="transactions-tbody">
                <!-- Loaded by JS -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop"></div>
  <div id="firebase-config-modal" class="modal-backdrop"></div>
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { initTransactionsPage } from '/js/transactions.js';
    initTransactionsPage();
  </script>
</body>
</html>
