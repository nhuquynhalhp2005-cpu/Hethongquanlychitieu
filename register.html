<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Ký Tài Khoản - Hệ Thống Theo Dõi Thu Chi & Kế Hoạch Tài Chính Cá Nhân</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">
        <i class="fas fa-wallet"></i>
      </div>
      <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
      <p class="auth-subtitle">Bắt đầu hành trình làm chủ tài chính cá nhân ngay hôm nay</p>
    </div>

    <!-- Alert Box -->
    <div id="auth-alert" class="auth-alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="reg-name">Họ và Tên</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="reg-name" class="form-control" placeholder="Nguyễn Văn A" required autocomplete="name" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Địa chỉ Email</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Mật khẩu</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="reg-password" class="form-control" placeholder="Tối thiểu 6 ký tự" required autocomplete="new-password" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-confirm-password">Xác nhận mật khẩu</label>
        <div class="input-with-icon">
          <i class="fas fa-shield-alt"></i>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Nhập lại mật khẩu" required autocomplete="new-password" />
        </div>
      </div>

      <div class="form-check" style="margin-bottom: 1.25rem;">
        <input type="checkbox" id="reg-terms" required checked />
        <label for="reg-terms" style="font-size: 0.8125rem; color: var(--text-muted); cursor: pointer;">
          Tôi đồng ý với các điều khoản bảo mật và quản lý tài chính cá nhân
        </label>
      </div>

      <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-block">
        <i class="fas fa-user-plus"></i> Đăng Ký Tài Khoản
      </button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản? <a href="/login.html">Đăng nhập tại đây</a>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { registerUser, getCurrentUser } from '/js/auth.js';
    import { showToast } from '/js/utils.js';

    if (getCurrentUser()) {
      window.location.replace('/dashboard.html');
    }

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('auth-alert');
    const btnSubmit = document.getElementById('btn-reg-submit');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = `auth-alert ${isError ? 'danger' : 'success'} active`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (!name) {
        showAlert('Vui lòng nhập họ và tên của bạn.');
        return;
      }
      if (password.length < 6) {
        showAlert('Mật khẩu phải chứa ít nhất 6 ký tự.');
        return;
      }
      if (password !== confirmPassword) {
        showAlert('Mật khẩu xác nhận không khớp.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tạo tài khoản...';

      try {
        await registerUser({ name, email, password, confirmPassword });
        showAlert('Đăng ký tài khoản thành công! Đang chuyển hướng vào hệ thống...', false);
        showToast('Chào mừng bạn đến với hệ thống quản lý tài chính!');
        setTimeout(() => {
          window.location.replace('/dashboard.html');
        }, 800);
      } catch (err) {
        showAlert(err.message || 'Đăng ký thất bại. Email này có thể đã được sử dụng.');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fas fa-user-plus"></i> Đăng Ký Tài Khoản';
      }
    });
  </script>
</body>
</html>
